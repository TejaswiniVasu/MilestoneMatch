services:
  - type: web
    name: milestone-match
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm test && npm run evaluate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
